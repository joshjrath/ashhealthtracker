<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0B0D">
<title>Today · Ash Health</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230B0B0D'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23F2A79C' stroke-width='4' stroke-dasharray='42 60' stroke-linecap='round' transform='rotate(-90 16 16)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <aside>
    <div class="inner">
      <a class="mark" href="#/today">ash<span>/health</span></a>
      <nav>
        <a href="#/today" data-page="today">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 3.5a6.5 6.5 0 0 1 6.5 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>Today</a>
        <a href="#/weight" data-page="weight">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6l4.5 5 3-3L17 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Weight</a>
        <a href="#/nutrition" data-page="nutrition">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="11" width="3" height="6" rx="1.2" fill="currentColor"/><rect x="8.5" y="7" width="3" height="10" rx="1.2" fill="currentColor"/><rect x="14" y="4" width="3" height="13" rx="1.2" fill="currentColor"/></svg>Nutrition</a>
        <a href="#/activity" data-page="activity">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13.5 3.5a6.8 6.8 0 1 0 3 9.8 5.4 5.4 0 0 1-3-9.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Activity &amp; sleep</a>
        <a href="#/calendar" data-page="calendar">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 8.5h14M7 2.8v3M13 2.8v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Calendar</a>
      </nav>
      <h3>Log</h3>
      <button type="button" class="logbtn" data-act="log">
        <span class="plus">+</span>Log a day
      </button>
      <a class="settings-link" href="#/settings" data-page="settings">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M4 14h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="6" r="2.2" fill="var(--rail)" stroke="currentColor" stroke-width="1.8"/><circle cx="13" cy="14" r="2.2" fill="var(--rail)" stroke="currentColor" stroke-width="1.8"/></svg>Goals &amp; data</a>
      <div class="live"><span class="pulse"></span>Saved in this browser</div>
    </div>
  </aside>
  <main id="view" aria-live="polite"></main>
</div>

<dialog id="log" aria-labelledby="logtitle">
  <form id="logform" method="dialog" novalidate>
    <header>
      <div>
        <div class="eyebrow dlg-day"></div>
        <h2 id="logtitle">Log a day</h2>
      </div>
      <button type="button" class="x" data-close aria-label="Close">×</button>
    </header>
    <label class="field wide"><span>Date</span><span class="inp"><input type="date" name="date" required></span></label>
    <div class="fields">
      <label class="field"><span>Weight</span><span class="inp"><input type="number" name="weight" step="0.1" min="0" inputmode="decimal"><em>lb</em></span></label>
      <label class="field"><span>Calories</span><span class="inp"><input type="number" name="kcal" step="1" min="0" inputmode="numeric"><em>kcal</em></span></label>
      <label class="field"><span>Protein</span><span class="inp"><input type="number" name="protein" step="1" min="0" inputmode="numeric"><em>g</em></span></label>
      <label class="field"><span>Carbs</span><span class="inp"><input type="number" name="carbs" step="1" min="0" inputmode="numeric"><em>g</em></span></label>
      <label class="field"><span>Fat</span><span class="inp"><input type="number" name="fat" step="1" min="0" inputmode="numeric"><em>g</em></span></label>
      <label class="field"><span>Fiber</span><span class="inp"><input type="number" name="fiber" step="1" min="0" inputmode="numeric"><em>g</em></span></label>
      <label class="field"><span>Steps</span><span class="inp"><input type="number" name="steps" step="1" min="0" inputmode="numeric"></span></label>
      <label class="field"><span>Bedtime (night before)</span><span class="inp"><input type="time" name="bed"></span></label>
      <label class="field"><span>Woke up</span><span class="inp"><input type="time" name="wake"></span></label>
    </div>
    <p class="hint" id="macrohint"></p>
    <div class="toggles">
      <label class="chk"><input type="checkbox" name="workout"><i style="--c:#F27DB5"></i>Worked out</label>
      <label class="chk"><input type="checkbox" name="creatine"><i style="--c:#62D6C4"></i>Took creatine</label>
    </div>
    <footer>
      <button type="button" class="btn danger ghost" id="logdelete">Delete day</button>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </footer>
  </form>
</dialog>

<div id="tip" role="tooltip" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
